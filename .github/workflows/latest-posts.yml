# Keeps the "Latest posts" list in README.md current from the Medium feed. It writes only between the
# BLOG-POST-LIST markers; the COCKPIT block is written by cockpit (RUNWAY) on every website promote.
# Actions are pinned to full commit SHAs (the tag is in the comment); the job can only write repository contents.
name: latest-posts
on:
  schedule:
    - cron: '0 1 * * *' # 06:30 IST, after the website's 06:00 rebuild
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: latest-posts
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: https://medium.com/feed/@aalishan001
          max_post_count: 5
